<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<title>Le jardin des lanternes</title>
<style>
:root{--ink:#0b1030;--amber:#ffb454;--paper:#ffe3b8;--sakura:#f6a9c4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,"Times New Roman",serif;color:var(--paper)}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:calc(14px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;pointer-events:none;opacity:0;transition:opacity .8s}
#dots{display:flex;gap:10px;padding:8px 16px;border-radius:999px;background:rgba(8,10,34,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,227,184,.55);background:transparent;transition:background .6s,box-shadow .6s,border-color .6s}
#dots i.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 12px 3px rgba(255,180,84,.7)}
#hint{position:fixed;left:24px;right:24px;bottom:calc(28px + env(safe-area-inset-bottom));text-align:center;font-size:15px;line-height:1.5;
  text-shadow:0 1px 10px #000;pointer-events:none;opacity:0;transition:opacity 1s}
#toast{position:fixed;left:24px;right:24px;top:30%;text-align:center;font-size:clamp(22px,6vw,34px);line-height:1.35;letter-spacing:.01em;
  text-shadow:0 2px 18px #000;pointer-events:none;opacity:0;transition:opacity 1.2s}
#stick{position:fixed;width:112px;height:112px;border-radius:50%;border:1.5px solid rgba(255,227,184,.35);background:rgba(255,227,184,.06);
  display:none;pointer-events:none;transform:translate(-50%,-50%)}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,227,184,.38)}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px;text-align:center;
  background:radial-gradient(ellipse at 50% 60%,rgba(8,10,34,.25),rgba(5,6,22,.82));transition:opacity 1.4s}
#intro.gone{opacity:0;pointer-events:none}
#intro h1{margin:0;font-weight:500;font-size:clamp(34px,10vw,64px);line-height:1.08;letter-spacing:.02em;text-shadow:0 0 30px rgba(255,180,84,.45)}
#intro p{margin:0;max-width:30ch;font-size:18px;line-height:1.55;color:rgba(255,227,184,.85)}
#go{font:inherit;font-size:18px;color:var(--paper);background:rgba(255,180,84,.14);border:1.5px solid rgba(255,180,84,.8);
  border-radius:999px;padding:14px 30px;cursor:pointer;touch-action:manipulation}
#go:active{background:rgba(255,180,84,.3)}
#go:focus-visible{outline:3px solid var(--sakura);outline-offset:3px}
</style>
</head>
<body>
<div id="hud"><div id="dots" aria-label="Lanternes allumées"></div></div>
<div id="hint"></div>
<div id="toast"></div>
<div id="stick"><div id="knob"></div></div>
<div id="intro">
  <h1>Le jardin<br>des lanternes</h1>
  <p>Une balade de nuit sous les cerisiers. Allume les sept lanternes de pierre.</p>
  <button id="go">Entrer dans le jardin</button>
</div>

/* cerisiers */
const lanternSpots=[[-3.3,7],[3.4,3],[-3.4,-3],[3.6,-9],[-12.5,-1.2],[11,-10],[-2.6,-13.5]];
function makeTree(x,z,s,solid){
  const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.3,2.6,7),new THREE.MeshLambertMaterial({color:0x3a2a2a}));trunk.position.y=1.3;g.add(trunk);
  const pm=new THREE.MeshLambertMaterial({color:0xf0a0c0,emissive:0x2a0c1c,flatShading:true});
  for(let i=0;i<5;i++){const b=new THREE.Mesh(new THREE.IcosahedronGeometry(1.1+R()*.6,1),pm);b.position.set((R()-.5)*2.2,3+R()*1.1,(R()-.5)*2.2);g.add(b);}
  scene.add(g);if(solid)cols.push({x,z,r:.5*s});
}
{
  let placed=0,tries=0;
  while(placed<24&&tries<600){
    tries++;
    const a=R()*6.283,r=8+R()*30,x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(Math.abs(x)<4.2&&z>-24&&z<16)continue;
    if(Math.hypot(x-POND.x,z-POND.z)<POND.r+2.6)continue;
    if(Math.hypot(x,z-12)<4)continue;
    if(Math.hypot(x,z-shrineZ)<5)continue;
    if(lanternSpots.some(p=>Math.hypot(x-p[0],z-p[1])<3))continue;
    makeTree(x,z,.9+R()*.5,true);placed++;
  }
  for(let i=0;i<30;i++){const a=R()*6.283,r=44+R()*30;makeTree(Math.cos(a)*r,Math.sin(a)*r,1.4+R()*.6,false);}
}

/* lanternes de pierre */
function makeLantern(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);
  const stone=new THREE.MeshLambertMaterial({color:0x6d6a7a});
  const add=(geo,mat,y)=>{const m=new THREE.Mesh(geo,mat);m.position.y=y;g.add(m);return m;};
  add(new THREE.BoxGeometry(.7,.18,.7),stone,.09);
  add(new THREE.CylinderGeometry(.11,.14,.9,8),stone,.63);
  add(new THREE.BoxGeometry(.55,.1,.55),stone,1.13);
  const fireMat=new THREE.MeshBasicMaterial({color:0x2b2118});
  add(new THREE.BoxGeometry(.34,.34,.34),fireMat,1.35);
  const roof=add(new THREE.ConeGeometry(.55,.38,4),stone,1.69);roof.rotation.y=Math.PI/4;
  add(new THREE.SphereGeometry(.09,8,6),stone,1.93);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowT,color:0xffb454,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0}));
  glow.position.y=1.4;glow.scale.setScalar(.01);g.add(glow);
  const pool=new THREE.Mesh(new THREE.CircleGeometry(3.2,24),new THREE.MeshBasicMaterial({map:glowT,color:0xff9a3c,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0}));
  pool.rotation.x=-Math.PI/2;pool.position.y=.05;g.add(pool);
  scene.add(g);cols.push({x,z,r:.55});
  return{x,z,lit:0,on:false,fireMat,glow,pool};
}

/* pétales & lucioles */

{ // photo -> texture + couleur de peau
  const img=new Image();
  img.onload=()=>{

    const tex=new THREE.CanvasTexture(c);tex.anisotropy=4;faceMat.map=tex;faceMat.emissiveMap=tex;faceMat.emissive.set(0xffffff);faceMat.needsUpdate=true;

/* ---------- entrées ---------- */
let started=false,yaw=0,pitch=.38,dist=5.6;
const keys={},stick={x:0,y:0,id:null,ox:0,oy:0},look={id:null,lx:0,ly:0};
const st=$('#stick'),knob=$('#knob');
addEventListener('keydown',e=>{keys[e.code]=true;});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('pointerdown',e=>{
  if(!started||e.target.id==='go')return;
  if(e.pointerType!=='mouse'&&e.clientX<innerWidth*.5&&stick.id===null){
    stick.id=e.pointerId;stick.ox=e.clientX;stick.oy=e.clientY;st.style.display='block';st.style.left=e.clientX+'px';st.style.top=e.clientY+'px';knob.style.transform='translate(0,0)';
  }else if(look.id===null){look.id=e.pointerId;look.lx=e.clientX;look.ly=e.clientY;}
});
addEventListener('pointermove',e=>{
  if(e.pointerId===stick.id){
    let dx=e.clientX-stick.ox,dy=e.clientY-stick.oy;const m=Math.hypot(dx,dy),Rr=56;
    if(m>Rr){dx*=Rr/m;dy*=Rr/m;}stick.x=dx/Rr;stick.y=-dy/Rr;knob.style.transform=`translate(${dx}px,${dy}px)`;
  }else if(e.pointerId===look.id){
    yaw-=(e.clientX-look.lx)*.006;pitch=clamp(pitch+(e.clientY-look.ly)*.004,.08,1.1);look.lx=e.clientX;look.ly=e.clientY;
  }
});
const up=e=>{if(e.pointerId===stick.id){stick.id=null;stick.x=stick.y=0;st.style.display='none';}if(e.pointerId===look.id)look.id=null;};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('wheel',e=>{dist=clamp(dist+e.deltaY*.005,3.5,9);},{passive:true});
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

/* ---------- interface ---------- */
const hint=$('#hint'),toastEl=$('#toast'),hud=$('#hud');
hint.textContent=isTouch?'Glisse à gauche pour marcher, à droite pour regarder':'Marche avec WASD ou les flèches, regarde en glissant la souris';
let toastTimer=0;
function toast(t,ms){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastEl.style.opacity=0;},ms||3200);}
$('#go').addEventListener('click',()=>{
  started=true;$('#intro').classList.add('gone');hud.style.opacity=1;hint.style.opacity=1;
  setTimeout(()=>{hint.style.opacity=0;},7000);
});

/* ---------- boucle ---------- */
let count=0,finale=false,finaleT=0,vx=0,vz=0,phase=0,turn=Math.PI,time=0,last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;

  /* déplacement */
  let ix=0,iy=0;
  if(started){
    ix=stick.x;iy=stick.y;
    if(keys.KeyW||keys.ArrowUp)iy+=1;if(keys.KeyS||keys.ArrowDown)iy-=1;
    if(keys.KeyD||keys.ArrowRight)ix+=1;if(keys.KeyA||keys.ArrowLeft)ix-=1;
    const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}
  }
  const run=(keys.ShiftLeft||keys.ShiftRight)?1.5:1,sp=4.2*run;
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const tx=(fx*iy+rx*ix)*sp,tz=(fz*iy+rz*ix)*sp,k=Math.min(1,dt*10);
  vx+=(tx-vx)*k;vz+=(tz-vz)*k;
  hero.position.x+=vx*dt;hero.position.z+=vz*dt;
  for(const c of cols){const dx=hero.position.x-c.x,dz=hero.position.z-c.z,d=Math.hypot(dx,dz),min=c.r+.35;if(d<min&&d>0){hero.position.x=c.x+dx/d*min;hero.position.z=c.z+dz/d*min;}}
  const wr=Math.hypot(hero.position.x,hero.position.z);if(wr>40){hero.position.x*=40/wr;hero.position.z*=40/wr;}
  const speed=Math.hypot(vx,vz);
  if(speed>.3){let target=Math.atan2(vx,vz),dA=target-turn;dA=Math.atan2(Math.sin(dA),Math.cos(dA));turn+=dA*Math.min(1,dt*10);hero.rotation.y=turn;}
  const mv=Math.min(1,speed/4.2);phase+=dt*(5+speed*1.6);
  const sw=Math.sin(phase)*.75*mv;
  legL.rotation.x=sw;legR.rotation.x=-sw;armL.rotation.x=-sw*.8;armR.rotation.x=sw*.8;
  rig.position.y=Math.abs(Math.sin(phase))*.06*mv+Math.sin(time*1.8)*.008;
  rig.rotation.z=Math.sin(phase)*.04*mv;
  heroL.position.set(hero.position.x,2.6,hero.position.z);

  /* caméra */
  if(!started)yaw+=dt*.12;
  const cp=started?pitch:.3,cd=started?dist:7.5;
  camera.position.set(hero.position.x+Math.sin(yaw)*Math.cos(cp)*cd,Math.max(.6,1.3+Math.sin(cp)*cd),hero.position.z+Math.cos(yaw)*Math.cos(cp)*cd);
  camera.lookAt(hero.position.x,1.25,hero.position.z);
  sky.position.copy(camera.position);

  /* lanternes */
  for(let i=0;i<lanterns.length;i++){
    const l=lanterns[i];
    if(!l.on&&started&&Math.hypot(hero.position.x-l.x,hero.position.z-l.z)<2.6){
      l.on=true;count++;dots.children[i].classList.add('on');
      if(count<lanterns.length)toast(count===1?'Une première lanterne s’allume':count+' sur '+lanterns.length,2200);
      else{toast('Les sept lanternes sont allumées. Regarde le ciel.',6500);finale=true;sky_l.forEach(o=>o.s.visible=true);}
    }
    l.lit+=((l.on?1:0)-l.lit)*Math.min(1,dt*2.2);
    const f=l.lit,fl=1+Math.sin(time*7+i*2)*.04;
    l.fireMat.color.setRGB(.17+.83*f,.13+.62*f,.09+.35*f);
    l.glow.material.opacity=f*.9;l.glow.scale.setScalar(.01+f*3.6*fl);
    l.pool.material.opacity=f*.32;
  }
  const prog=count/lanterns.length;
  doorMat.opacity=.12+.88*prog;shrineGlow.material.opacity=prog*.7;

  /* finale */
  if(finale){
    finaleT+=dt;const fade=Math.min(1,finaleT/4);
    for(const o of sky_l){
      o.s.position.y+=o.v*dt;o.s.position.x+=Math.sin(time*.4+o.ph)*dt*.5;
      if(o.s.position.y>46){o.s.position.set(hero.position.x+(R()-.5)*50,0,hero.position.z+(R()-.5)*50-4);}
      o.s.material.opacity=fade*o.base*(.8+Math.sin(time*3+o.ph)*.2);
    }
  }

  /* pétales */
  for(let i=0;i<PET;i++){
    let x=petals[i*3],y=petals[i*3+1],z=petals[i*3+2];
    y-=dt*(.55+petalSeed[i]*.06);x+=Math.sin(time*.7+petalSeed[i])*dt*.5+dt*.25;z+=Math.cos(time*.6+petalSeed[i])*dt*.3;
    if(y<0){y=10+R()*3;}
    if(x-hero.position.x>22)x-=44;else if(x-hero.position.x<-22)x+=44;
    if(z-hero.position.z>22)z-=44;else if(z-hero.position.z<-22)z+=44;
    petals[i*3]=x;petals[i*3+1]=y;petals[i*3+2]=z;
  }
  petalGeo.attributes.position.needsUpdate=true;

  /* lucioles */
  for(let i=0;i<FF;i++){
    const b=ffBase[i],t=time*b[4]+b[3];
    ffPos[i*3]=b[0]+Math.sin(t)*.9;ffPos[i*3+1]=b[1]+Math.sin(t*1.3)*.5;ffPos[i*3+2]=b[2]+Math.cos(t*.9)*.9;
  }
  ffGeo.attributes.position.needsUpdate=true;ffMat.opacity=.65+Math.sin(time*2.2)*.3;

  /* ondes de l'étang */
  rings.forEach((r,i)=>{const t=((time*.22)+i/3)%1;r.scale.setScalar(.6+t*1.9);r.material.opacity=.32*(1-t);});

  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
